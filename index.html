<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPTennis 全国门店照片册</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}
.city-section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 0 60px;
  overflow: hidden;
}
.city-bg {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover; background-position: center;
  filter: brightness(0.35) saturate(0.8);
  z-index: 0; transition: transform 8s ease;
}
.city-section:hover .city-bg { transform: scale(1.05); }
.city-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
  z-index: 1;
}
.city-content { position: relative; z-index: 2; width: 100%; }
.city-header { padding: 0 40px 40px; max-width: 1400px; margin: 0 auto; }
.city-name { font-size: clamp(32px, 5vw, 56px); font-weight: 300; letter-spacing: 0.15em; color: #fff; line-height: 1.2; }
.city-name-en { font-size: clamp(11px, 1.2vw, 13px); font-weight: 400; letter-spacing: 0.25em; color: rgba(255,255,255,0.5); margin-top: 8px; text-transform: uppercase; }
.store-count { font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.4); margin-top: 12px; letter-spacing: 0.05em; }
.gallery-wrapper { position: relative; width: 100%; padding: 0 40px; }
.gallery-scroll {
  display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory;
  scroll-behavior: smooth; padding: 20px 0 40px; scrollbar-width: none; -ms-overflow-style: none;
}
.gallery-scroll::-webkit-scrollbar { display: none; }
.store-group { flex-shrink: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 16px; }
.store-label { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; padding-left: 4px; white-space: nowrap; }
.store-photos { display: flex; gap: 16px; }
.photo-card { flex-shrink: 0; width: 340px; height: 460px; border-radius: 8px; overflow: hidden; position: relative; background: #1a1a1a; cursor: pointer; transition: transform 0.4s ease, box-shadow 0.4s ease; }
.photo-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s ease; }
.photo-card:hover img { transform: scale(1.03); }
.photo-card.horizontal { width: 520px; height: 380px; }
.nav-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px;
  border-radius: 50%; background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 18px; cursor: pointer;
  z-index: 10; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; opacity: 0; pointer-events: none;
}
.gallery-wrapper:hover .nav-arrow { opacity: 1; pointer-events: auto; }
.nav-arrow:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); }
.nav-arrow.left { left: 8px; }
.nav-arrow.right { right: 8px; }
.nav-arrow.visible { opacity: 1; pointer-events: auto; }
.city-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%); }
.photo-card img { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); }
@media (max-width: 768px) {
  .city-header { padding: 0 20px 30px; }
  .gallery-wrapper { padding: 0 20px; }
  .photo-card { width: 280px; height: 380px; }
  .photo-card.horizontal { width: 340px; height: 260px; }
  .nav-arrow { display: none; }
}
</style>
</head>
<body>
